name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (prek hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: j178/prek-action@v3.1.0

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest

  build:
    name: build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist and wheel (wheel built from the sdist)
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          expected="$(uv version --short)"
          uv venv --no-project "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          got="$("$RUNNER_TEMP/smoke/bin/stoopid" --version)"
          test "$got" = "$expected" || { echo "::error::version $got != $expected"; exit 1; }
          # Product-agnostic: the commands change as agents build the concept (spec 0002).
          "$RUNNER_TEMP/smoke/bin/stoopid" --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Single required status check for the main ruleset.
  ci-ok:
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
