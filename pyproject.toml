[project]
name = "stoopid"
version = "0.0.0"
description = "A deliberately meaningless package used to exercise a fully automated release pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Harvey", email = "simon.harvey.86@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mighty-muffin/stoopid"
Changelog = "https://github.com/mighty-muffin/stoopid/blob/main/CHANGELOG.md"
Issues = "https://github.com/mighty-muffin/stoopid/issues"

[project.scripts]
stoopid = "stoopid.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=stoopid --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stoopid"]
